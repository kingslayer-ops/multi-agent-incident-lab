name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=incident_lab --cov-report=term-missing --cov-fail-under=90
      - name: Reject legacy branding
        run: |
          if rg -n -i 'ops[p]ilot|brand-mark.*>O[P]<' .; then
            echo "Legacy project branding detected."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: multi-agent-incident-lab:ci

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Build and start isolated E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - name: Run Chromium smoke path
        if: github.event_name == 'pull_request'
        run: npm run test:smoke
        working-directory: e2e
      - name: Run Chromium full resilience suite
        if: github.event_name != 'pull_request'
        run: npm test
        working-directory: e2e
      - name: Collect service logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose -f docker-compose.e2e.yml logs --no-color > e2e/test-results/compose.log
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop isolated E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
