name: multi-agent-incident-lab-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident_lab_test
      POSTGRES_USER: incident_lab
      POSTGRES_PASSWORD: incident_lab
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_lab -d incident_lab_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
