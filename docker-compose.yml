name: multi-agent-incident-lab

services:
  incident-lab:
    build: .
    ports:
      - "8000:8000"
    environment:
      INCIDENT_LAB_LLM_MODE: ${INCIDENT_LAB_LLM_MODE:-mock}
      INCIDENT_LAB_DB_PATH: /app/data/incident-lab.db
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INCIDENT_LAB_LLM_TIMEOUT: ${INCIDENT_LAB_LLM_TIMEOUT:-12}
    volumes:
      - incident-lab-data:/app/data
    restart: unless-stopped

volumes:
  incident-lab-data:
