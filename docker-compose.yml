name: multi-agent-incident-lab

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      INCIDENT_LAB_LLM_MODE: ${INCIDENT_LAB_LLM_MODE:-mock}
      INCIDENT_LAB_DB_PATH: /app/data/incident-lab.db
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INCIDENT_LAB_LLM_TIMEOUT: ${INCIDENT_LAB_LLM_TIMEOUT:-12}
    volumes:
      - incident-lab-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "incident_lab.worker"]
    environment:
      INCIDENT_LAB_LLM_MODE: ${INCIDENT_LAB_LLM_MODE:-mock}
      INCIDENT_LAB_DB_PATH: /app/data/incident-lab.db
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INCIDENT_LAB_LLM_TIMEOUT: ${INCIDENT_LAB_LLM_TIMEOUT:-12}
    volumes:
      - incident-lab-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  incident-lab-data:
