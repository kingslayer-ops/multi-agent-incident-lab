[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-incident-lab"
version = "1.4.0"
description = "Evidence-driven multi-agent incident response laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
production = [
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<0.13",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
# The PostgreSQL adapter is exercised by the dedicated real-service CI job.
# Keep the 90% unit-test gate focused on the provider-independent core.
omit = ["src/incident_lab/postgres.py"]
